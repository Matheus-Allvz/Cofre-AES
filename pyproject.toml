[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607"]
# Ferramenta local de carga: chama o docker e a URL passada na linha de comando.
"scripts/*" = ["S310", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
