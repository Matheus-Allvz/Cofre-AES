[tool.ruff]
line-length = 100
# py313, não py314, de propósito: com py314 o `ruff format` tira os parênteses de
# `except (A, B):` (PEP 758, só válido na 3.14) e o código deixa de rodar em < 3.14.
# Com py313 o `ruff check` acusa essa forma como erro. O runtime continua 3.14 (Dockerfile/CI).
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607"]
# Ferramenta local de carga: chama o docker e a URL passada na linha de comando.
"scripts/*" = ["S310", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Pool/thread não encerrado vira erro, não aviso perdido no fim da saída.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
