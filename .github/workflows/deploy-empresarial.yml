# Deploy de produção (Fase 9): push na empresarial → testes (ci.yml) → SSH na VPS →
# /home/deploy/cofre-empresa-api/deploy-empresarial.sh. Reaproveita os secrets
# CI_DEPLOY_SSH_HOST/USER/KEY. A branch main e o workflow deploy.yml dela não mudam.
name: Deploy (empresarial)

on:
  push:
    branches: [empresarial]

permissions:
  contents: read

concurrency:
  group: deploy-empresarial
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.CI_DEPLOY_SSH_USER }}
          key: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: /home/deploy/cofre-empresa-api/deploy-empresarial.sh
